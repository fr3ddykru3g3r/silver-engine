<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="white"/>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#111}.sub{font:19px Arial,sans-serif;fill:#333}.axis{stroke:#333;stroke-width:2}.grid{stroke:#ddd;stroke-width:1}.lab{font:18px Arial,sans-serif;fill:#222}.small{font:15px Arial,sans-serif;fill:#444}.v{font:700 16px Arial,sans-serif;fill:#111}.std{fill:#bdbdbd;stroke:#333;stroke-width:1}.epi{fill:#dedede;stroke:#333;stroke-width:1}.onset{fill:#f4f4f4;stroke:#111;stroke-width:2}
  </style>
  <text x="55" y="55" class="title">The same fixed predictions can tell a different story under a different scientific question</text>
  <text x="55" y="90" class="sub">True Skill Statistic (TSS), exposed 2014–2017 expanding out-of-fold development cohort.</text>

  <line x1="120" y1="640" x2="1120" y2="640" class="axis"/>
  <line x1="120" y1="160" x2="120" y2="640" class="axis"/>
  <line x1="120" y1="520" x2="1120" y2="520" class="grid"/><text x="72" y="526" class="lab">0.2</text>
  <line x1="120" y1="400" x2="1120" y2="400" class="grid"/><text x="72" y="406" class="lab">0.4</text>
  <line x1="120" y1="280" x2="1120" y2="280" class="grid"/><text x="72" y="286" class="lab">0.6</text>
  <line x1="120" y1="160" x2="1120" y2="160" class="grid"/><text x="72" y="166" class="lab">0.8</text>
  <text x="44" y="650" class="lab">0.0</text>

  <!-- Active diagnostic -->
  <rect x="170" y="306" width="46" height="334" class="std"/><text x="171" y="296" class="v">.556</text>
  <rect x="220" y="300" width="46" height="340" class="epi"/><text x="221" y="290" class="v">.567</text>
  <rect x="270" y="640" width="46" height="0" class="onset"/><text x="275" y="626" class="v">.000</text>
  <text x="166" y="680" class="small">Already-active</text><text x="174" y="699" class="small">diagnostic</text>

  <!-- Elastic net -->
  <rect x="410" y="255" width="46" height="385" class="std"/><text x="411" y="245" class="v">.642</text>
  <rect x="460" y="181" width="46" height="459" class="epi"/><text x="461" y="171" class="v">.765</text>
  <rect x="510" y="241" width="46" height="399" class="onset"/><text x="511" y="231" class="v">.665</text>
  <text x="428" y="680" class="small">Elastic-net</text><text x="445" y="699" class="small">joint</text>

  <!-- Joint XGB -->
  <rect x="650" y="246" width="46" height="394" class="std"/><text x="651" y="236" class="v">.657</text>
  <rect x="700" y="374" width="46" height="266" class="epi"/><text x="701" y="364" class="v">.443</text>
  <rect x="750" y="614" width="46" height="26" class="onset"/><text x="751" y="604" class="v">.043</text>
  <text x="677" y="680" class="small">XGBoost</text><text x="690" y="699" class="small">joint</text>

  <!-- XRS only -->
  <rect x="890" y="448" width="46" height="192" class="std"/><text x="891" y="438" class="v">.320</text>
  <rect x="940" y="480" width="46" height="160" class="epi"/><text x="941" y="470" class="v">.266</text>
  <rect x="990" y="510" width="46" height="130" class="onset"/><text x="991" y="500" class="v">.216</text>
  <text x="918" y="680" class="small">XGBoost</text><text x="918" y="699" class="small">XRS-only</text>

  <rect x="790" y="105" width="22" height="22" class="std"/><text x="822" y="122" class="lab">standard occurrence</text>
  <rect x="790" y="135" width="22" height="22" class="epi"/><text x="822" y="152" class="lab">episode-normalized occurrence</text>
  <rect x="790" y="165" width="22" height="22" class="onset"/><text x="822" y="182" class="lab">new onset</text>

  <text x="55" y="735" class="small">Important: only five distinct onset episodes were available internally; onset model-rank differences are therefore not all statistically secure.</text>
</svg>