  <text x="942" y="202" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Solar + XRS + proton</text>
  <text x="942" y="232" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Full frozen stack</text>
  <text x="942" y="265" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#065f46">Normal only if provenance also passes</text>

