  <text x="525" y="253" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">are actually present?</text>

  <line x1="650" y1="210" x2="735" y2="210" stroke="#6b7280" stroke-width="4"/>
  <polygon points="735,210 717,199 717,221" fill="#6b7280"/>

