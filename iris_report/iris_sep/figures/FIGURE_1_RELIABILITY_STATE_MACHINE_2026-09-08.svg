  <text x="185" y="190" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#111827">Incoming evidence</text>
  <text x="185" y="224" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Solar/context</text>
  <text x="185" y="250" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">X-ray (XRS) · Proton history</text>

  <line x1="310" y1="210" x2="390" y2="210" stroke="#6b7280" stroke-width="4"/>
  <polygon points="390,210 372,199 372,221" fill="#6b7280"/>

