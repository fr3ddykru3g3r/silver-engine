  <rect x="820" y="570" width="304" height="58" rx="14" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="972" y="606" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#991b1b">NO ALERT</text>

  <text x="60" y="635" font-family="Arial" font-size="17" fill="#4b5563">Frozen candidate: IRIS_AVAILABILITY_DISTILLED_EVIDENCE_STACK_V3 · No runtime feed fabrication or retraining.</text>
  <text x="60" y="660" font-family="Arial" font-size="15" fill="#6b7280">Source: config/eight_issue_status_2026-09-08.json · development architecture, not independent prospective skill.</text>
