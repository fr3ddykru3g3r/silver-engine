<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">IRIS-SEP reliability-aware forecast state machine</title>
  <desc id="desc">A plain-language diagram showing how available solar, X-ray, and proton evidence selects full, degraded, or abstain behavior.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">A probability is not automatically a trustworthy warning</text>
  <text x="60" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">IRIS-SEP separates the numerical forecast from permission to expose it.</text>

