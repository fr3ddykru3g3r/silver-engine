  <text x="227" y="413" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Solar + proton only</text>
  <text x="227" y="443" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Pre-trained reduced-input model</text>
  <rect x="150" y="462" width="155" height="32" rx="16" fill="#f59e0b"/>
  <text x="227" y="485" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">DEGRADED</text>

  <rect x="432" y="340" width="335" height="165" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="599" y="380" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#92400e">NO_PROTON</text>
  <text x="599" y="413" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Solar + XRS only</text>
  <text x="599" y="443" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Pre-trained reduced-input model</text>
  <rect x="522" y="462" width="155" height="32" rx="16" fill="#f59e0b"/>
  <text x="599" y="485" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">DEGRADED</text>

  <rect x="804" y="340" width="336" height="165" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="972" y="380" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#991b1b">NO_XRS_OR_PROTON</text>
  <text x="972" y="413" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Solar-only diagnostic</text>
