<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">False-positive reduction versus lost detections in the rejected monotone veto</title>
  <desc id="desc">Development score comparison showing that the veto reduced false positives by 28.5 percent without XRS and 25.4 percent without proton, but lost one and three true positives respectively.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">Large false-alarm cuts came with lost detections</text>
  <text x="60" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">Development-only monotone veto experiment — rejected, not promoted.</text>

  <text x="60" y="160" font-family="Arial" font-size="24" font-weight="700" fill="#111827">NO_XRS</text>
  <text x="60" y="195" font-family="Arial" font-size="18" fill="#374151">Frozen V3</text>
  <rect x="190" y="176" width="603" height="28" rx="6" fill="#c7d2fe"/>
  <text x="805" y="197" font-family="Arial" font-size="18" font-weight="700" fill="#3730a3">603 FP · 13 TP</text>

  <text x="60" y="245" font-family="Arial" font-size="18" fill="#374151">Veto</text>
  <rect x="190" y="226" width="431" height="28" rx="6" fill="#fde68a"/>
  <text x="635" y="247" font-family="Arial" font-size="18" font-weight="700" fill="#92400e">431 FP · 12 TP</text>
  <rect x="870" y="218" width="250" height="48" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="995" y="249" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#92400e">−28.5% FP, −1 TP</text>

  <line x1="60" y1="305" x2="1140" y2="305" stroke="#e5e7eb" stroke-width="2"/>

  <text x="60" y="365" font-family="Arial" font-size="24" font-weight="700" fill="#111827">NO_PROTON</text>
  <text x="60" y="400" font-family="Arial" font-size="18" fill="#374151">Frozen V3</text>
  <rect x="190" y="381" width="796" height="28" rx="6" fill="#c7d2fe"/>
  <text x="998" y="402" font-family="Arial" font-size="18" font-weight="700" fill="#3730a3">796 FP · 16 TP</text>

  <text x="60" y="450" font-family="Arial" font-size="18" fill="#374151">Veto</text>
  <rect x="190" y="431" width="594" height="28" rx="6" fill="#fde68a"/>
  <text x="798" y="452" font-family="Arial" font-size="18" font-weight="700" fill="#92400e">594 FP · 13 TP</text>
  <rect x="870" y="423" width="250" height="48" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="995" y="454" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#92400e">−25.4% FP, −3 TP</text>

  <rect x="60" y="525" width="1080" height="95" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="85" y="562" font-family="Arial" font-size="21" font-weight="700" fill="#111827">Decision:</text>
  <text x="185" y="562" font-family="Arial" font-size="21" fill="#111827">reject the veto and keep plain V3.</text>
  <text x="85" y="596" font-family="Arial" font-size="18" fill="#4b5563">Further post-hoc tuning on this already-inspected score block would increase overfitting risk.</text>

  <text x="60" y="655" font-family="Arial" font-size="15" fill="#6b7280">Source: monotone-veto development run 34216432375 · score block already inspected · bars encode false positives, labels report true positives.</text>
</svg>
