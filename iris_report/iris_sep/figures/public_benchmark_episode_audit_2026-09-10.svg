<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="white"/>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#111}.sub{font:20px Arial,sans-serif;fill:#333}.big{font:700 54px Arial,sans-serif;fill:#111}.label{font:700 22px Arial,sans-serif;fill:#111}.body{font:18px Arial,sans-serif;fill:#333}.note{font:16px Arial,sans-serif;fill:#444}.card{fill:#f5f5f5;stroke:#222;stroke-width:2}.bar{fill:#d8d8d8;stroke:#222;stroke-width:2}.bar2{fill:#efefef;stroke:#222;stroke-width:2}
  </style>
  <text x="60" y="60" class="title">Public benchmark audit: windows are not the same as physical storms</text>
  <text x="60" y="96" class="sub">Pinned SEP rolling dataset; audit reconstructs ≥10 pfu operational episode intervals.</text>

  <rect x="60" y="135" width="320" height="170" rx="14" class="card"/>
  <text x="90" y="190" class="big">11,773</text>
  <text x="90" y="230" class="label">24-hour forecast windows</text>
  <text x="90" y="270" class="body">the unit used by the public rolling table</text>

  <rect x="440" y="135" width="320" height="170" rx="14" class="card"/>
  <text x="470" y="190" class="big">610</text>
  <text x="470" y="230" class="label">mapped positive windows</text>
  <text x="470" y="270" class="body">that could be assigned to one physical episode</text>

  <rect x="820" y="135" width="320" height="170" rx="14" class="card"/>
  <text x="850" y="190" class="big">256</text>
  <text x="850" y="230" class="label">physical SEP episodes</text>
  <text x="850" y="270" class="body">represented by those 610 positive windows</text>

  <text x="60" y="365" class="label">Episode multiplicity factor = 610 / 256 = 2.38×</text>
  <rect x="60" y="400" width="1020" height="58" rx="8" class="bar2"/>
  <rect x="60" y="400" width="658" height="58" rx="8" class="bar"/>
  <text x="80" y="438" class="body">411 already-active persistence windows</text>
  <text x="740" y="438" class="body">227 new-onset windows</text>

  <text x="60" y="520" class="label">Why it matters</text>
  <text x="60" y="557" class="body">A long storm can influence a window-level score several times, and an already-active storm can be easier to recognize than to predict before onset.</text>
  <text x="60" y="595" class="body">Our benchmark therefore reports conventional window skill, physical-episode-normalized skill, and genuine new-onset skill separately.</text>

  <text x="60" y="645" class="note">Boundary: this audit motivates the method; it does not claim the published SEPNET final SEPVAL score is wrong.</text>
</svg>