name: IRIS v2 Stable BASE Recovery Gate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  stable-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Download integrity-locked historical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence_bundle evidence
          gh run download 32937498427 -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          python iris-gate0-data/repair_historical_tai_manifest.py --evidence-dir evidence
          test -f evidence/data/derived/training_manifest.csv.gz
      - name: Train recovery BASE on training partition only
        run: |
          set -euo pipefail
          python iris-model/train_generator_v2.py \
            --evidence-dir evidence --cache-dir cache/stable-base \
            --out-dir outputs --condition base --seed 2026 \
            --per-group 4 --positive-slots 4 --batch-size 16 --physics-batch-size 16 \
            --base-channels 24 --diffusion-steps 100 --max-steps 1200 \
            --lr 1e-4 --lr-schedule cosine --lambda-generic 0.08 \
            --ema-decay 0.995 --ema-warmup-steps 100 \
            --download-workers 16
      - name: Sample matched training-positive audit set
        run: |
          set -euo pipefail
          python iris-model/sample_generator.py \
            --checkpoint outputs/base/generator.pt --evidence-dir evidence \
            --out-dir matched/base --per-group 2 --max-groups 64 \
            --batch-size 8 --sampling-steps 50 --seed 2026
      - name: Run corrected independent train-only fidelity gate
        run: |
          set -euo pipefail
          python iris-model/evaluate_generator_v2_fixed.py \
            --evidence-dir evidence --cache-dir cache_eval/stable-base \
            --synthetic-manifest matched/base/synthetic_manifest.csv \
            --out-dir audit/base --real-per-group 2 --seed 2026
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/base/v2_manipulation_metrics.json')
          j=json.loads(p.read_text())
          report={
              'phase':'TRAIN-ONLY stable BASE recovery gate; no forecast validation/test accessed',
              'protocol':'GENERATOR_RECOVERY_GATE_2026-08-27',
              'generic_fidelity_gate_pass':bool(j['generic_fidelity_gate_pass']),
              'generic_distance_to_real_baseline_ratio':j['generic_distance_to_real_baseline_ratio'],
              'flux_ratio':j['synthetic_to_real_flux_median_ratio'],
              'active_area_ratio':j['synthetic_to_real_active_area_median_ratio'],
              'diversity_ratio':j['synthetic_to_real_diversity_ratio'],
              'saturation':j['synthetic_saturation_fraction_abs_gt_2900G'],
              'status':'PASS' if j['generic_fidelity_gate_pass'] else 'FAIL_REDESIGN_GENERATOR',
          }
          Path('stable_base_recovery_gate.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if report['status'] != 'PASS':
              raise SystemExit('Stable BASE recovery failed; physics transfer remains blocked')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-v2-stable-base-recovery
          path: |
            outputs/base
            matched/base
            audit/base
            stable_base_recovery_gate.json
          retention-days: 30
