name: IRIS v2 Positive Physics 2000-Step Sweep

on:
  push:
    branches: [iris-v2-physics-transfer]
    paths:
      - '.github/workflows/iris-v2-positive-physics-2000.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: pil010
            condition: pil
            lambda_pil: '0.10'
            lambda_hj: '0.0'
          - tag: pil050
            condition: pil
            lambda_pil: '0.50'
            lambda_hj: '0.0'
          - tag: pil100
            condition: pil
            lambda_pil: '1.00'
            lambda_hj: '0.0'
          - tag: hj010
            condition: hj
            lambda_pil: '0.0'
            lambda_hj: '0.10'
          - tag: hj050
            condition: hj
            lambda_pil: '0.0'
            lambda_hj: '0.50'
          - tag: hj100
            condition: hj
            lambda_pil: '0.0'
            lambda_hj: '1.00'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-v2-physics-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Download frozen historical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence_bundle evidence
          gh run download 32937498427 -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          python iris-gate0-data/repair_historical_tai_manifest.py --evidence-dir evidence
          test -f evidence/data/derived/training_manifest.csv.gz
      - name: Train selected physics arm at converged BASE budget
        run: |
          python iris-model/train_generator_positive_v2.py \
            --evidence-dir evidence --cache-dir cache/shared --out-dir run/outputs \
            --condition ${{ matrix.condition }} --lambda-pil ${{ matrix.lambda_pil }} --lambda-hj ${{ matrix.lambda_hj }} --seed 2026 \
            --per-group 4 --batch-size 16 --physics-batch-size 16 --base-channels 16 \
            --diffusion-steps 100 --max-steps 2000 --physics-warmup-steps 200 --download-workers 16
      - name: Sample fixed train-only manipulation set
        run: |
          python iris-model/sample_generator.py \
            --checkpoint run/outputs/generator.pt --evidence-dir evidence \
            --out-dir run/samples --per-group 2 --max-groups 64 \
            --batch-size 8 --sampling-steps 50 --seed 2026
      - uses: actions/upload-artifact@v4
        with:
          name: iris-v2-positive-physics-2000-${{ matrix.tag }}
          path: run
          retention-days: 30

  select:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-v2-physics-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU evaluation runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Download frozen historical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence_bundle evidence
          gh run download 32937498427 -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          python iris-gate0-data/repair_historical_tai_manifest.py --evidence-dir evidence
      - name: Download converged 2000-step BASE artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p arms/base
          gh run download 32997814571 -n iris-v2-base-convergence-2000 -D arms/base
      - name: Download all 2000-step constrained arms
        uses: actions/download-artifact@v4
        with:
          pattern: iris-v2-positive-physics-2000-*
          path: arms/constrained
      - name: Re-evaluate every arm with corrected outcome-blind evaluator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corrected
          manifest() { find "$1" -name synthetic_manifest.csv -print -quit; }
          eval_arm() {
            tag="$1"; src="$2"; m=$(manifest "$src"); test -n "$m"
            python iris-model/evaluate_generator_v2_fixed.py \
              --evidence-dir evidence --cache-dir cache_eval/shared \
              --synthetic-manifest "$m" --out-dir "corrected/$tag" \
              --real-per-group 2 --seed 2026
          }
          eval_arm base arms/base
          for t in pil010 pil050 pil100 hj010 hj050 hj100; do
            eval_arm "$t" "arms/constrained/iris-v2-positive-physics-2000-$t"
          done
      - name: Freeze train-only PIL and HJ coefficients
        run: |
          python - <<'PY'
          import json, pathlib
          tags=['base','pil010','pil050','pil100','hj010','hj050','hj100']
          M={t:json.loads(pathlib.Path(f'corrected/{t}/v2_manipulation_metrics.json').read_text()) for t in tags}
          b=M['base']
          if not b['generic_fidelity_gate_pass']:
              raise SystemExit('2000-step BASE fails corrected generic fidelity; physics selection blocked and generator redesign required')
          def row(tag, family, lam):
              m=M[tag]
              target='hard_pil_standardized_energy_distance' if family=='PIL' else 'hard_geometry_standardized_energy_distance'
              cross='hard_geometry_standardized_energy_distance' if family=='PIL' else 'hard_pil_standardized_energy_distance'
              bd=float(b[target]); bc=float(b[cross]); td=float(m[target]); cd=float(m[cross])
              improvement=(bd-td)/bd if bd>0 else float('-inf')
              cross_ratio=cd/max(bc,1e-9)
              passed=bool(m['generic_fidelity_gate_pass'] and improvement>=0.20 and cross_ratio<=1.50)
              return {'tag':tag,'lambda':lam,'target_distance':td,'target_improvement_vs_base':improvement,
                      'cross_structure_distance_ratio_vs_base':cross_ratio,
                      'generic_gate_pass':bool(m['generic_fidelity_gate_pass']),'pass':passed}
          pil=[row('pil010','PIL',0.10),row('pil050','PIL',0.50),row('pil100','PIL',1.00)]
          hj=[row('hj010','HJ',0.10),row('hj050','HJ',0.50),row('hj100','HJ',1.00)]
          ppass=[r for r in pil if r['pass']]; hpass=[r for r in hj if r['pass']]
          ps=min(ppass,key=lambda r:r['lambda']) if ppass else None
          hs=min(hpass,key=lambda r:r['lambda']) if hpass else None
          report={
            'phase':'TRAIN_ONLY_POSITIVE_GENERATOR_PHYSICS_SELECTION_2000',
            'forecast_metrics_accessed':False,
            'base_budget_steps':2000,
            'evaluator':'evaluate_generator_v2_fixed.py',
            'selection_rule':'smallest lambda with corrected generic-fidelity PASS, >=20% independent hard target-distance improvement, and <=1.5x degradation of the other targeted structure',
            'base':{'generic_gate_pass':bool(b['generic_fidelity_gate_pass']),
                    'pil_distance':b['hard_pil_standardized_energy_distance'],
                    'geometry_distance':b['hard_geometry_standardized_energy_distance']},
            'PIL':{'candidates':pil,'selected_smallest_passing':ps,'status':'PASS' if ps else 'FAIL_REDESIGN_OR_EXTEND_GRID'},
            'HJ':{'candidates':hj,'selected_smallest_passing':hs,'status':'PASS' if hs else 'FAIL_REDESIGN_OR_EXTEND_GRID'},
          }
          report['overall_status']='PASS' if ps and hs else 'INCOMPLETE'
          pathlib.Path('positive_physics_selection_2000.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if report['overall_status']!='PASS':
              raise SystemExit('One or more 2000-step train-only physics manipulation gates failed; downstream benchmark intentionally blocked')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-v2-positive-physics-selection-2000
          path: |
            positive_physics_selection_2000.json
            corrected
          retention-days: 30
