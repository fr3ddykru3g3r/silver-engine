name: IRIS v2 Reaudit Actual 3280-Step BASE

on:
  push:
    branches: [iris-v2-physics-transfer]
    paths:
      - '.github/workflows/iris-v2-reaudit-3280-base.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  reaudit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-v2-physics-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Download integrity evidence and actual 3280-step checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence_bundle evidence base3280
          gh run download 32937498427 -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          python iris-gate0-data/repair_historical_tai_manifest.py --evidence-dir evidence
          gh run download 32997814571 -n iris-v2-base-convergence-6000 -D base3280
          test -f base3280/outputs/base/generator.pt
          python - <<'PY'
          import torch
          ck=torch.load('base3280/outputs/base/generator.pt',map_location='cpu',weights_only=False)
          assert int(ck['steps']) == 3280, ck.get('steps')
          print({'verified_actual_steps':ck['steps']})
          PY
      - name: Re-sample with matched evaluation protocol
        run: |
          python iris-model/sample_generator.py \
            --checkpoint base3280/outputs/base/generator.pt --evidence-dir evidence \
            --out-dir matched/base --per-group 2 --max-groups 64 --batch-size 8 --sampling-steps 50 --seed 2026
      - name: Corrected independent generic fidelity audit
        run: |
          python iris-model/evaluate_generator_v2_fixed.py \
            --evidence-dir evidence --cache-dir cache_eval/base \
            --synthetic-manifest matched/base/synthetic_manifest.csv --out-dir audit/base --real-per-group 2 --seed 2026
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('audit/base/v2_manipulation_metrics.json')
          j=json.loads(p.read_text())
          out={
            'actual_training_steps':3280,
            'generic_fidelity_gate_pass':bool(j['generic_fidelity_gate_pass']),
            'generic_distance_to_real_baseline_ratio':j['generic_distance_to_real_baseline_ratio'],
            'flux_ratio':j['synthetic_to_real_flux_median_ratio'],
            'active_area_ratio':j['synthetic_to_real_active_area_median_ratio'],
            'diversity_ratio':j['synthetic_to_real_diversity_ratio'],
            'saturation':j['synthetic_saturation_fraction_abs_gt_2900G'],
            'hard_pil_distance':j['hard_pil_standardized_energy_distance'],
            'hard_geometry_distance':j['hard_geometry_standardized_energy_distance'],
            'phase':'TRAIN-ONLY generic fidelity; no forecast validation/test accessed'
          }
          pathlib.Path('reaudit_3280_summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not out['generic_fidelity_gate_pass']:
              raise SystemExit('Actual 3280-step BASE still fails generic fidelity; exact-budget retraining required')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-v2-reaudit-actual-3280-base
          path: |
            reaudit_3280_summary.json
            audit/base
            matched/base/sampling_summary.json
          retention-days: 30
