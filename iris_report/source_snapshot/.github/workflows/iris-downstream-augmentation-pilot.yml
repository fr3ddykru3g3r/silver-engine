name: IRIS Matched Synthetic Augmentation Validation

on:
  push:
    branches: [iris-generator-historical]
    paths:
      - 'iris-model/train_matched_augmentation.py'
      - '.github/workflows/iris-downstream-augmentation-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  downstream:
    strategy:
      fail-fast: false
      matrix:
        arm: [real, rw, duplicate, base, hj, pil, hj_pil]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-generator-historical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt
      - name: Download integrity-locked historical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence_bundle evidence
          gh run download 32937498427 -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          python iris-gate0-data/repair_historical_tai_manifest.py --evidence-dir evidence
      - name: Wait for generator pilot and download requested synthetic arm
        if: matrix.arm != 'real' && matrix.arm != 'rw' && matrix.arm != 'duplicate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gen_bundle gen_artifact
          ok=0
          for i in $(seq 1 180); do
            rm -rf gen_bundle/*
            if gh run download 32956336168 -n iris-generator-${{ matrix.arm }}-pilot -D gen_bundle 2>/dev/null; then ok=1; break; fi
            echo "Generator ${{ matrix.arm }} artifact not ready ($i/180); waiting 60 s"
            sleep 60
          done
          test "$ok" = 1
          tar -xzf gen_bundle/iris-generator-${{ matrix.arm }}-pilot.tar.gz -C gen_artifact
          test -f gen_artifact/samples/${{ matrix.arm }}/synthetic_manifest.csv
      - name: Train matched arm with locked test
        shell: bash
        run: |
          set -e
          COMMON="--evidence-dir evidence --cache-dir cache --out-dir outputs/${{ matrix.arm }} --seed 2026 --train-per-group 4 --val-per-group 6 --pos-cap 2 --width 48 --dropout 0.2 --gamma 1.5 --lr 0.0003 --batch-size 32 --steps 1200 --eval-every 300 --download-workers 16"
          case "${{ matrix.arm }}" in
            real) python iris-model/train_matched_augmentation.py $COMMON --arm real --class-weighting none ;;
            rw) python iris-model/train_matched_augmentation.py $COMMON --arm real_weighted --class-weighting balanced ;;
            duplicate) python iris-model/train_matched_augmentation.py $COMMON --arm duplicate --class-weighting none --augmentation-count 250 ;;
            base|hj|pil|hj_pil) python iris-model/train_matched_augmentation.py $COMMON --arm synthetic --class-weighting none --synthetic-manifest gen_artifact/samples/${{ matrix.arm }}/synthetic_manifest.csv --augmentation-count 250 ;;
          esac
      - name: Package
        run: tar -czf iris-downstream-${{ matrix.arm }}.tar.gz outputs/${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        with:
          name: iris-downstream-${{ matrix.arm }}
          path: iris-downstream-${{ matrix.arm }}.tar.gz
          retention-days: 30
