name: IRIS-SEP availability direct specialist v2

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/config/availability_direct_specialist_v2_preregistration_2026-09-07.json'
      - 'iris_report/iris_sep/src/iris_sep/modeling/availability_direct_specialist.py'
      - 'iris_report/iris_sep/src/iris_sep/modeling/availability_trust.py'
      - 'iris_report/iris_sep/tools/run_availability_direct_specialist_v2.py'
      - 'iris_report/iris_sep/tests/test_availability_direct_specialist.py'
      - 'iris_report/iris_sep/tests/test_availability_trust.py'
      - '.github/workflows/iris-sep-availability-direct-specialist-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-specialist-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out continuation branch with ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preregistration predates result-capable implementation
        run: |
          git merge-base --is-ancestor 021b77c55b8c12aeb41cb4bf304f9b3aef71dfef HEAD
          test -f iris_report/iris_sep/config/availability_direct_specialist_v2_preregistration_2026-09-07.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.3.2 \
            scipy==1.18.1 \
            scikit-learn==1.8.0 \
            xgboost==3.0.4

      - name: Compile and run source tests
        run: |
          python -m py_compile \
            iris_report/iris_sep/src/iris_sep/modeling/availability_direct_specialist.py \
            iris_report/iris_sep/src/iris_sep/modeling/availability_trust.py \
            iris_report/iris_sep/tools/run_availability_direct_specialist_v2.py
          python -m unittest discover -s iris_report/iris_sep/tests -p 'test_availability_direct_specialist.py' -v
          python -m unittest discover -s iris_report/iris_sep/tests -p 'test_availability_trust.py' -v

      - name: Acquire hash-pinned public development inputs
        run: |
          mkdir -p /tmp/sep-prism/Data
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/Data/rolling_combinded_seq_24hours.csv' \
            --output /tmp/sep-prism/Data/rolling_combinded_seq_24hours.csv
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv' \
            --output /tmp/sep-prism/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv
          test "$(sha256sum /tmp/sep-prism/Data/rolling_combinded_seq_24hours.csv | cut -d' ' -f1)" = '4691cedd3209a2823b9e3c5e3dfe5676bde42befc1af14e33f35a220b6dfa0fb'
          test "$(sha256sum /tmp/sep-prism/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv | cut -d' ' -f1)" = '0ec9f0d6e088821091fcd369481bbbc9a2281a92fc8a582df40aefa62cae59b0'

      - name: Run frozen V2 development comparison
        run: |
          python -m iris_report.iris_sep.tools.run_availability_direct_specialist_v2 \
            --features /tmp/sep-prism/Data/rolling_combinded_seq_24hours.csv \
            --events /tmp/sep-prism/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv \
            --output /tmp/direct-specialist-v2 \
            > /tmp/direct-specialist-v2.stdout.json

      - name: Print decision receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/direct-specialist-v2/summary.json').read_text())
          out={
            'candidate_for_future_untouched_evaluation':d['candidate_for_future_untouched_evaluation'],
            'states':{
              s:{
                'keep_gate':v['keep_gate'],
                'v1_TSS':v['v1_scalar_fusion']['metrics']['TSS'],
                'v2_TSS':v['v2_direct_specialist']['metrics']['TSS'],
                'v1_review_enrichment':v['v1_scalar_fusion']['review_5pct']['enrichment_vs_random_review'],
                'v2_review_enrichment':v['v2_direct_specialist']['review_5pct']['enrichment_vs_random_review'],
              }
              for s,v in d['states'].items()
            }
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          assert d['locked_test_accessed'] is False
          assert d['monitor_used'] is False
          assert d['imputation_used'] is False
          assert d['reconstruction_used'] is False
          PY

      - name: Bind runtime
        run: |
          python - <<'PY'
          import hashlib,json,platform
          from pathlib import Path
          import numpy,pandas,scipy,sklearn,xgboost
          root=Path('/tmp/direct-specialist-v2')
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          payload={
            'git_head':'${{ github.sha }}',
            'python':platform.python_version(),
            'numpy':numpy.__version__,
            'pandas':pandas.__version__,
            'scipy':scipy.__version__,
            'scikit_learn':sklearn.__version__,
            'xgboost':xgboost.__version__,
            'preregistration_ancestor_commit':'021b77c55b8c12aeb41cb4bf304f9b3aef71dfef',
            'summary_sha256':h(root/'summary.json'),
            'predictions_sha256':h(root/'predictions.csv'),
            'receipt_sha256':h(root/'receipt.json'),
            'locked_test_accessed':False,
            'monitor_used':False,
          }
          (root/'runtime.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-availability-direct-specialist-v2-${{ github.sha }}
          path: /tmp/direct-specialist-v2
          if-no-files-found: error
          retention-days: 30
