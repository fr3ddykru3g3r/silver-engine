name: IRIS Historical HMI Data Collection

on:
  push:
    branches: [iris-historical-data]
    paths:
      - 'iris-gate0-data/**'
      - '.github/workflows/iris-historical-collect.yml'
  workflow_dispatch:

concurrency:
  group: iris-historical-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-historical-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r iris-gate0-data/requirements.txt
      - name: Fetch full-HMI flare and HARP mapping
        run: python iris-gate0-data/fetch_historical.py
      - name: Query all NOAA-associated definitive SHARPs
        run: python iris-gate0-data/query_sharp.py
      - name: Build historical connected-region manifest
        run: python iris-gate0-data/build_manifest.py
      - name: Verify representative FITS retrieval
        run: python iris-gate0-data/smoke_download.py
      - name: Package evidence
        run: |
          cd iris-gate0-data
          find data -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          tar -czf ../iris-historical-evidence.tar.gz data SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iris-historical-evidence
          path: iris-historical-evidence.tar.gz
          retention-days: 30
