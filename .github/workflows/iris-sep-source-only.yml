name: IRIS-SEP source-only verification

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/src/**'
      - 'iris_report/iris_sep/tools/run_compact_nonfinite_replay.py'
      - 'iris_report/iris_sep/tests/test_pilot_replay.py'
      - 'iris_report/iris_sep/tests/test_pilot_admission_v2.py'
      - 'iris_report/iris_sep/tests/test_validity_envelope_benchmark.py'
      - 'iris_report/iris_sep/tests/test_compound_validity_benchmark.py'
      - 'iris_report/iris_sep/tests/test_inference_bundle.py'
      - 'iris_report/iris_sep/tests/test_compact_layer_replay.py'
      - 'iris_report/iris_sep/tests/test_compact_nonfinite_replay_tool.py'
      - '.github/workflows/iris-sep-source-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - name: Install bounded source-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Record runtime
        run: |
          python - <<'PY'
          import platform
          import numpy
          import sklearn
          import torch
          print('python', platform.python_version())
          print('numpy', numpy.__version__)
          print('torch', torch.__version__)
          print('scikit_learn', sklearn.__version__)
          PY

      - name: Run source-only unit tests
        run: |
          python -m unittest \
            iris_report.iris_sep.tests.test_pilot_replay \
            iris_report.iris_sep.tests.test_pilot_admission_v2 \
            iris_report.iris_sep.tests.test_validity_envelope_benchmark \
            iris_report.iris_sep.tests.test_compound_validity_benchmark \
            iris_report.iris_sep.tests.test_inference_bundle \
            iris_report.iris_sep.tests.test_compact_layer_replay \
            iris_report.iris_sep.tests.test_compact_nonfinite_replay_tool -v

      - name: Compile changed source and tests
        run: |
          python -m py_compile \
            iris_report/iris_sep/src/iris_sep/inference_bundle.py \
            iris_report/iris_sep/src/iris_sep/modeling/compact_layer_replay.py \
            iris_report/iris_sep/tools/run_compact_nonfinite_replay.py \
            iris_report/iris_sep/tests/test_inference_bundle.py \
            iris_report/iris_sep/tests/test_compact_layer_replay.py \
            iris_report/iris_sep/tests/test_compact_nonfinite_replay_tool.py
