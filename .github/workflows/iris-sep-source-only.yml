name: IRIS-SEP source-only verification

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/src/**'
      - 'iris_report/iris_sep/tools/**'
      - 'iris_report/iris_sep/tests/**'
      - 'iris_report/iris_sep/config/**'
      - '.github/workflows/iris-sep-source-only.yml'
  pull_request:
    paths:
      - 'iris_report/iris_sep/src/**'
      - 'iris_report/iris_sep/tools/**'
      - 'iris_report/iris_sep/tests/**'
      - 'iris_report/iris_sep/config/**'
      - '.github/workflows/iris-sep-source-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    name: source-only pandas-${{ matrix.pandas }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pandas: ['2.3.2', '3.0.1']

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - name: Install bounded source-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==${{ matrix.pandas }} \
            scipy==1.18.1 \
            scikit-learn==1.8.0 \
            xgboost==3.0.4 \
            matplotlib==3.10.6 \
            requests==2.32.5 \
            pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Record runtime
        run: |
          mkdir -p source_only_ci_logs
          python - <<'PY' | tee source_only_ci_logs/runtime.txt
          import platform
          import matplotlib, numpy, pandas, pytest, requests, scipy, sklearn, torch, xgboost
          print('python', platform.python_version())
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('pytest', pytest.__version__)
          print('requests', requests.__version__)
          print('scipy', scipy.__version__)
          print('scikit_learn', sklearn.__version__)
          print('xgboost', xgboost.__version__)
          print('matplotlib', matplotlib.__version__)
          print('torch', torch.__version__)
          PY

      - name: Compile every IRIS-SEP Python source file
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          roots = [
              Path('iris_report/iris_sep/src'),
              Path('iris_report/iris_sep/tools'),
              Path('iris_report/iris_sep/tests'),
          ]
          files = sorted(p for root in roots for p in root.rglob('*.py'))
          print('compiling', len(files), 'files')
          for path in files:
              py_compile.compile(str(path), doraise=True)
          PY

      - name: Run every source-only test and inventory data-bound exclusions
        shell: bash
        run: |
          set -o pipefail
          python -m iris_report.iris_sep.tools.run_source_only_tests 2>&1 | tee source_only_ci_logs/pytest.txt

      - name: Verify JSON configuration parses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('iris_report/iris_sep/config').glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print('parsed', len(files), 'configuration files')
          PY

      - name: Assert data-dependent tests are explicitly registered
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('iris_report/iris_sep/config/data_dependent_test_registry_v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          print('ignored data-bound files:', len(data['ignore_files']))
          print('deselected data-bound nodeids:', len(data['deselect_nodeids']))
          print('source-only success does not establish data-dependent test success or forecasting usefulness')
          PY

      - name: Upload source-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-source-only-pandas-${{ matrix.pandas }}-${{ github.sha }}
          path: source_only_ci_logs/
          if-no-files-found: error
          retention-days: 14
