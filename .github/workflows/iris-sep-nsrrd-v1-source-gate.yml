name: IRIS-SEP NSRRD-V1 source gate

on:
  workflow_dispatch:
  push:
    branches: [codex/iris-sep-episode-benchmark-v1-20260909]
    paths:
      - 'iris_report/iris_sep/config/noaa_sgps_reprocessed_retrospective_development_v1_source_contract_2026-09-12.json'
      - 'iris_report/iris_sep/config/noaa_sgps_reprocessed_retrospective_development_v1_preregistration_2026-09-12.json'
      - 'iris_report/iris_sep/tools/run_noaa_sgps_reprocessed_source_gate_v1.py'
      - 'iris_report/iris_sep/tests/test_noaa_sgps_reprocessed_source_gate_v1.py'
      - '.github/workflows/iris-sep-nsrrd-v1-source-gate.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install bounded source-only dependencies
        run: python -m pip install requests==2.32.5 netCDF4==1.7.2 pytest==8.4.2
      - name: Run offline source-gate tests
        run: |
          python -m py_compile iris_report/iris_sep/tools/run_noaa_sgps_reprocessed_source_gate_v1.py
          python -m pytest -q iris_report/iris_sep/tests/test_noaa_sgps_reprocessed_source_gate_v1.py
      - name: Run frozen NOAA source gate
        run: |
          rm -rf /tmp/nsrrd-v1-source-gate
          python -m iris_report.iris_sep.tools.run_noaa_sgps_reprocessed_source_gate_v1 --output /tmp/nsrrd-v1-source-gate
      - name: Bind runtime safety receipt
        if: always()
        run: |
          mkdir -p /tmp/nsrrd-v1-source-gate
          python - <<'PY'
          import json, platform
          from pathlib import Path
          import netCDF4, requests
          Path('/tmp/nsrrd-v1-source-gate/runtime.json').write_text(json.dumps({
            'git_head': '${{ github.sha }}', 'python': platform.python_version(),
            'netCDF4': netCDF4.__version__, 'requests': requests.__version__,
            'labels_derived': False, 'training_performed': False,
            'forecast_skill_computed': False, 'protected_outcomes_accessed': False,
          }, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-nsrrd-v1-source-gate-${{ github.sha }}
          path: /tmp/nsrrd-v1-source-gate
          retention-days: 90
