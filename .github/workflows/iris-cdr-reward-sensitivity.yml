    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-cdr-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision|shap)' iris-model/requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt
      - name: Wait for exact 40x36m CDR evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cdr_bundle evidence
          ok=0
          for i in $(seq 1 180); do
            rm -rf cdr_bundle/*
            if gh run download 32950459311 -n iris-cdr-feature-evidence -D cdr_bundle 2>/dev/null; then ok=1; break; fi
            echo "CDR evidence not ready ($i/180); waiting 60 s"
            sleep 60
          done
          test "$ok" = 1
          tar -xzf cdr_bundle/iris-cdr-feature-evidence.tar.gz -C evidence
      - name: Run one-at-a-time reward perturbation on validation only
        run: |
          python iris-model/train_cdr.py \
            --model cdr_transformer_10 \
            --evidence-dir evidence \
            --cache-dir cache \
            --out-dir outputs/${{ matrix.name }} \
            --seed 2026 \
            --train-per-group 1 \
            --eval-per-group 2 \
            --pos-cap 1 \
            --seq-len 40 \
            --reduced-update-rate \
            --reward-tp ${{ matrix.tp }} \
            --reward-tn ${{ matrix.tn }} \
            --reward-fp ${{ matrix.fp }} \
            --reward-fn ${{ matrix.fn }}
      - name: Package
        run: tar -czf iris-cdr-reward-${{ matrix.name }}.tar.gz outputs/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: iris-cdr-reward-${{ matrix.name }}
          path: iris-cdr-reward-${{ matrix.name }}.tar.gz
          retention-days: 30
