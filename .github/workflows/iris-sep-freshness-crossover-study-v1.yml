name: IRIS-SEP freshness crossover study V1

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/config/freshness_crossover_study_v1_preregistration_2026-09-09.json'
      - 'iris_report/iris_sep/config/freshness_crossover_study_v1_implementation_freeze_2026-09-09.json'
      - 'iris_report/iris_sep/config/freshness_crossover_study_v1_policy_pooling_clarification_2026-09-09.json'
      - 'iris_report/iris_sep/config/freshness_crossover_study_v1_statistical_and_control_clarification_2026-09-09.json'
      - 'iris_report/iris_sep/tools/run_freshness_crossover_study_v1.py'
      - 'iris_report/iris_sep/tools/run_freshness_crossover_study_v1_reliable.py'
      - '.github/workflows/iris-sep-freshness-crossover-study-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-retrospective-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed execution dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy<3' \
            'pandas<3' \
            'scipy<2' \
            'scikit-learn<2' \
            'xgboost<4' \
            'netCDF4<2' \
            'requests<3'

      - name: Validate direct source before data access
        run: |
          python -m py_compile iris_report/iris_sep/tools/run_freshness_crossover_study_v1.py
          python -m py_compile iris_report/iris_sep/tools/run_freshness_crossover_study_v1_reliable.py
          sha256sum iris_report/iris_sep/tools/run_freshness_crossover_study_v1.py
          sha256sum iris_report/iris_sep/tools/run_freshness_crossover_study_v1_reliable.py
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('iris_report/iris_sep/config')
          files=[
            'freshness_crossover_study_v1_preregistration_2026-09-09.json',
            'freshness_crossover_study_v1_implementation_freeze_2026-09-09.json',
            'freshness_crossover_study_v1_policy_pooling_clarification_2026-09-09.json',
            'freshness_crossover_study_v1_statistical_and_control_clarification_2026-09-09.json',
          ]
          for f in files: json.loads((base/f).read_text())
          print('contracts: PASS; no data accessed')
          PY

      - name: Execute frozen retrospective study
        run: |
          rm -rf /tmp/iris-sep-freshness-crossover-v1 /tmp/freshness_raw_cache
          python -m iris_report.iris_sep.tools.run_freshness_crossover_study_v1_reliable \
            --output /tmp/iris-sep-freshness-crossover-v1

      - name: Bind exact source, runtime and contracts
        if: always()
        run: |
          mkdir -p /tmp/iris-sep-freshness-crossover-v1
          cp iris_report/iris_sep/tools/run_freshness_crossover_study_v1.py /tmp/iris-sep-freshness-crossover-v1/EXECUTED_SOURCE.py
          cp iris_report/iris_sep/tools/run_freshness_crossover_study_v1_reliable.py /tmp/iris-sep-freshness-crossover-v1/NETWORK_WRAPPER.py
          git rev-parse HEAD > /tmp/iris-sep-freshness-crossover-v1/git_head.txt
          python - <<'PY'
          import json, platform
          import numpy,pandas,scipy,sklearn,xgboost,netCDF4,requests
          from pathlib import Path
          Path('/tmp/iris-sep-freshness-crossover-v1/runtime.json').write_text(json.dumps({
            'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,
            'scipy':scipy.__version__,'sklearn':sklearn.__version__,'xgboost':xgboost.__version__,
            'netCDF4':netCDF4.__version__,'requests':requests.__version__
          },indent=2,sort_keys=True)+'\n')
          PY
          cp iris_report/iris_sep/config/freshness_crossover_study_v1_preregistration_2026-09-09.json /tmp/iris-sep-freshness-crossover-v1/
          cp iris_report/iris_sep/config/freshness_crossover_study_v1_implementation_freeze_2026-09-09.json /tmp/iris-sep-freshness-crossover-v1/
          cp iris_report/iris_sep/config/freshness_crossover_study_v1_policy_pooling_clarification_2026-09-09.json /tmp/iris-sep-freshness-crossover-v1/
          cp iris_report/iris_sep/config/freshness_crossover_study_v1_statistical_and_control_clarification_2026-09-09.json /tmp/iris-sep-freshness-crossover-v1/

      - name: Upload immutable study evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-freshness-crossover-v1-${{ github.sha }}
          path: /tmp/iris-sep-freshness-crossover-v1
          if-no-files-found: warn
          retention-days: 30
