name: IRIS-SEP episode benchmark published audit

on:
  push:
    branches:
      - codex/iris-sep-episode-benchmark-v1-20260909
    paths:
      - 'iris_report/iris_sep/config/episode_normalized_causal_benchmark_v1_mechanism_decomposition_2026-09-09.json'
      - 'iris_report/iris_sep/tools/episode_semantics.py'
      - 'iris_report/iris_sep/tools/run_episode_benchmark_published_audit_v1.py'
      - 'iris_report/iris_sep/tests/test_episode_semantics.py'
      - 'iris_report/iris_sep/tests/test_episode_normalized_benchmark.py'
      - '.github/workflows/iris-sep-episode-benchmark-published-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install pinned bounded dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.3.2 requests==2.32.5 pytest==8.4.2

      - name: Compile benchmark source
        run: |
          python -m py_compile iris_report/iris_sep/tools/episode_semantics.py
          python -m py_compile iris_report/iris_sep/tools/episode_normalized_benchmark.py
          python -m py_compile iris_report/iris_sep/tools/run_episode_benchmark_published_audit_v1.py

      - name: Run synthetic and property tests
        env:
          PYTHONPATH: iris_report/iris_sep
        run: |
          python -m pytest -q \
            iris_report/iris_sep/tests/test_episode_semantics.py \
            iris_report/iris_sep/tests/test_episode_normalized_benchmark.py

      - name: Run pinned public SEPNET data audit
        env:
          PYTHONPATH: iris_report/iris_sep
        run: |
          rm -rf /tmp/episode-published-audit
          python -m tools.run_episode_benchmark_published_audit_v1 \
            --output /tmp/episode-published-audit

      - name: Record runtime and claim boundary
        if: always()
        run: |
          mkdir -p /tmp/episode-published-audit
          python - <<'PY'
          import json, platform
          from pathlib import Path
          import numpy, pandas, requests
          Path('/tmp/episode-published-audit/runtime.json').write_text(json.dumps({
            'git_head': '${{ github.sha }}',
            'python': platform.python_version(),
            'numpy': numpy.__version__,
            'pandas': pandas.__version__,
            'requests': requests.__version__,
            'protected_post_2025_outcomes_accessed': False,
            'model_scores_computed': False,
            'published_final_test_score_reproduced': False,
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable published-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-episode-published-audit-${{ github.sha }}
          path: /tmp/episode-published-audit
          if-no-files-found: warn
          retention-days: 30
