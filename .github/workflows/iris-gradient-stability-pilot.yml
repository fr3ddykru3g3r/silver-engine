name: IRIS Physics Gradient Stability Pilot

on:
  push:
    branches: [codex/iris-base-report-2026-08-31]
    paths:
      - '.github/workflows/iris-gradient-stability-pilot.yml'
      - 'iris-model/train_generator_positive_v2.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  EVIDENCE_RUN: '32937498427'
  SOURCE_RUN: '33479159121'
  SEED: '2026'
  FIT_ARCHIVE: 'IRIS_Colab_FULL_WITH_ACQUIRED_DATA_2026-08-31.zip'
  PYTHONUNBUFFERED: '1'

jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: hj-r025
            condition: hj
            lambda_hj: '0.05'
            lambda_pil: '0.0'
            gradient_ratio: '0.25'
          - label: hjpil-r010
            condition: hj_pil
            lambda_hj: '0.05'
            lambda_pil: '0.10'
            gradient_ratio: '0.10'
          - label: hjpil-r025
            condition: hj_pil
            lambda_hj: '0.05'
            lambda_pil: '0.10'
            gradient_ratio: '0.25'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      IRIS_FITS_SOURCE: 'fits_source/fits'
      IRIS_REQUIRE_LOCAL_FITS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt
      - name: Restore frozen evidence and FITS cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence_bundle evidence fits_bundle fits_source base_artifact
          gh run download "$EVIDENCE_RUN" -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          python iris-gate0-data/repair_historical_tai_manifest.py --evidence-dir evidence
          gh release download iris-2026-08-31 --repo fr3ddykru3g3r/silver-engine \
            --pattern "$FIT_ARCHIVE" --dir fits_bundle
          unzip -q "fits_bundle/$FIT_ARCHIVE" 'fits/*.fits' -d fits_source
          fits_count=$(find fits_source/fits -type f -name '*.fits' | wc -l | tr -d ' ')
          test "$fits_count" = 5273
          python - <<'PY'
          import sys
          sys.path.insert(0, 'iris-model')
          from fit_cache import verify_local_cache
          verify_local_cache(
              'evidence', 'fits_source/fits',
              run_base=False, run_physics=True, run_downstream=False,
              seed=2026, strict=False,
              write_report='fits_source/pilot_cache_report.json',
          )
          PY
      - name: Restore corrected BASE checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" -n physics-base -D base_artifact
          checkpoint=$(find base_artifact -name generator.pt -print -quit)
          test -n "$checkpoint"
          printf '%s\n' "$checkpoint" > base_checkpoint.txt
      - name: Run trust-region physics pilot
        run: |
          set -euo pipefail
          checkpoint=$(cat base_checkpoint.txt)
          python iris-model/train_generator_positive_v2.py \
            --evidence-dir evidence --cache-dir cache/${{ matrix.label }} \
            --out-dir pilot/${{ matrix.label }} --condition ${{ matrix.condition }} \
            --seed "$SEED" --init-checkpoint "$checkpoint" --per-group 4 \
            --batch-size 16 --physics-batch-size 16 --base-channels 24 \
            --diffusion-steps 100 --max-steps 400 --physics-warmup-steps 200 \
            --lambda-hj ${{ matrix.lambda_hj }} --lambda-pil ${{ matrix.lambda_pil }} \
            --lambda-generic 0.08 --lr 0.0001 --lr-schedule cosine \
            --ema-decay 0.995 --ema-warmup-steps 100 \
            --physics-gradient-ratio ${{ matrix.gradient_ratio }} \
            --download-workers 16 --threads 2 --checkpoint-every 200 \
            --prepared-cache cache/${{ matrix.label }}_prepared
          checkpoint=$(find pilot/${{ matrix.label }} -name generator.pt -print -quit)
          test -n "$checkpoint"
          python iris-model/sample_generator.py \
            --checkpoint "$checkpoint" --evidence-dir evidence \
            --out-dir pilot/${{ matrix.label }}/samples --per-group 2 \
            --max-groups 125 --batch-size 8 --sampling-steps 50 --seed "$SEED"
          manifest=$(find pilot/${{ matrix.label }}/samples -name synthetic_manifest.csv -print -quit)
          test -n "$manifest"
          test "$(python -c "import pandas as p; print(len(p.read_csv('$manifest')))")" = 250
          python iris-model/evaluate_generator_v2_fixed.py \
            --evidence-dir evidence --cache-dir cache/eval-${{ matrix.label }} \
            --synthetic-manifest "$manifest" \
            --out-dir pilot/${{ matrix.label }}/audit --real-per-group 2 --seed "$SEED"
      - uses: actions/upload-artifact@v4
        with:
          name: gradient-${{ matrix.label }}
          path: pilot/${{ matrix.label }}
          retention-days: 30

  summary:
    needs: pilot
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install numpy pandas scikit-learn
      - uses: actions/download-artifact@v4
        with:
          pattern: gradient-*
          path: collected
      - name: Write pilot summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for p in sorted(Path('collected').rglob('v2_manipulation_metrics.json')):
              d = json.loads(p.read_text())
              rel = p.relative_to('collected').parts
              rows.append({
                  'path': str(p),
                  'label': rel[0] if rel else None,
                  'generic_gate_pass': d.get('generic_fidelity_gate_pass'),
                  'generic_distance_ratio': d.get('generic_distance_to_real_baseline_ratio'),
                  'geometry_distance': d.get('hard_geometry_standardized_energy_distance'),
                  'pil_distance': d.get('hard_pil_standardized_energy_distance'),
                  'flux_median_ratio': d.get('synthetic_to_real_flux_median_ratio'),
                  'active_area_median_ratio': d.get('synthetic_to_real_active_area_median_ratio'),
                  'diversity_ratio': d.get('synthetic_to_real_diversity_ratio'),
              })
          Path('gradient_pilot_summary.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows, indent=2))
          if not rows:
              raise SystemExit('no gradient pilot metrics found')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iris-gradient-stability-pilot-summary
          path: gradient_pilot_summary.json
          retention-days: 30
