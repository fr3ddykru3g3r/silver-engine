name: IRIS-SEP freshness XRS directory diagnostic

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - '.github/workflows/iris-sep-freshness-xrs-directory-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-xrs-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install requests
        run: python -m pip install requests==2.32.5

      - name: Capture bounded NCEI directory listings
        run: |
          rm -rf /tmp/ncei-xrs-layout
          mkdir -p /tmp/ncei-xrs-layout
          python - <<'PY'
          import hashlib, html.parser, json, pathlib, requests

          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'a':
                      for k,v in attrs:
                          if k.lower() == 'href' and v:
                              self.links.append(v)

          months=['2011/01','2014/06','2017/06']
          out=[]
          for month in months:
              url=f'https://www.ncei.noaa.gov/data/goes-space-environment-monitor/access/avg/{month}/'
              r=requests.get(url,timeout=60,headers={'User-Agent':'IRIS-SEP-XRS-layout-diagnostic/1.0'})
              r.raise_for_status()
              if len(r.content) > 3_000_000: raise RuntimeError('listing exceeded bound')
              p=Links(); p.feed(r.text)
              links=sorted(set(p.links))
              entry={
                  'month':month.replace('/','-'),
                  'url':url,
                  'bytes':len(r.content),
                  'sha256':hashlib.sha256(r.content).hexdigest(),
                  'links':links,
                  'links_containing_g15': [x for x in links if 'g15' in x.lower()],
                  'links_containing_xrs': [x for x in links if 'xrs' in x.lower()],
              }
              out.append(entry)
              pathlib.Path(f'/tmp/ncei-xrs-layout/{month.replace("/", "-")}.html').write_bytes(r.content)
          receipt={
              'format':'IRIS_SEP_NCEI_XRS_DIRECTORY_DIAGNOSTIC_V1',
              'git_head':'${{ github.sha }}',
              'training_performed':False,
              'labels_derived':False,
              'forecast_skill_computed':False,
              'locked_test_accessed':False,
              'directories':out,
          }
          pathlib.Path('/tmp/ncei-xrs-layout/directory_links.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps([{k:v for k,v in e.items() if k not in ('links',)} for e in out],indent=2))
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-ncei-xrs-layout-${{ github.sha }}
          path: /tmp/ncei-xrs-layout
          retention-days: 30
