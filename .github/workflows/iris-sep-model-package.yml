name: IRIS-SEP promoted load-only model package

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/src/iris_sep/promoted_model_package.py'
      - 'iris_report/iris_sep/tools/build_promoted_model_package.py'
      - 'iris_report/iris_sep/tests/test_promoted_model_package.py'
      - '.github/workflows/iris-sep-model-package.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FEATURE_SHA256: 4691cedd3209a2823b9e3c5e3dfe5676bde42befc1af14e33f35a220b6dfa0fb
  EVENT_SHA256: 0ec9f0d6e088821091fcd369481bbbc9a2281a92fc8a582df40aefa62cae59b0

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out continuation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.3.2 \
            scikit-learn==1.8.0 \
            scipy==1.18.1 \
            xgboost==3.0.4

      - name: Compile and test package runtime
        run: |
          python -m py_compile \
            iris_report/iris_sep/src/iris_sep/promoted_model_package.py \
            iris_report/iris_sep/tools/build_promoted_model_package.py \
            iris_report/iris_sep/tests/test_promoted_model_package.py
          python -m unittest iris_report.iris_sep.tests.test_promoted_model_package -v

      - name: Acquire hash-pinned public development inputs
        run: |
          mkdir -p /tmp/sep-prism/Data
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/Data/rolling_combinded_seq_24hours.csv' \
            --output /tmp/sep-prism/Data/rolling_combinded_seq_24hours.csv
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv' \
            --output /tmp/sep-prism/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv
          test "$(sha256sum /tmp/sep-prism/Data/rolling_combinded_seq_24hours.csv | cut -d' ' -f1)" = "$FEATURE_SHA256"
          test "$(sha256sum /tmp/sep-prism/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv | cut -d' ' -f1)" = "$EVENT_SHA256"

      - name: Fit once, export, reload and verify reference predictions
        run: |
          python -m iris_report.iris_sep.tools.build_promoted_model_package \
            --features /tmp/sep-prism/Data/rolling_combinded_seq_24hours.csv \
            --events /tmp/sep-prism/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv \
            --output /tmp/iris-sep-model-package

      - name: Record source head
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/iris-sep-model-package/source_binding.json')
          p.write_text(json.dumps({
              'git_head': '${{ github.sha }}',
              'locked_test_accessed': False,
              'runtime_training_allowed': False,
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable package evidence
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-promoted-model-package-${{ github.sha }}
          path: /tmp/iris-sep-model-package
          if-no-files-found: error
          retention-days: 30
