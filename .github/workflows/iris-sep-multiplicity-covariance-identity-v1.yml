name: IRIS-SEP multiplicity covariance identity V1

on:
  push:
    branches:
      - codex/iris-sep-award-validation-v1-20260913
    paths:
      - 'iris_report/iris_sep/tools/verify_multiplicity_covariance_identity_v1.py'
      - 'iris_report/iris_sep/tests/test_multiplicity_covariance_identity_v1.py'
      - '.github/workflows/iris-sep-multiplicity-covariance-identity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install bounded dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.3.2 pytest==8.4.2
      - name: Run exact-identity unit tests
        env:
          PYTHONPATH: iris_report/iris_sep
        run: |
          python -m py_compile iris_report/iris_sep/tools/verify_multiplicity_covariance_identity_v1.py
          python -m pytest -q iris_report/iris_sep/tests/test_multiplicity_covariance_identity_v1.py
      - name: Download immutable fixed-replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/frozen-replay
          gh api repos/${{ github.repository }}/actions/artifacts/10137507101/zip > /tmp/frozen-replay.zip
          echo '81ec33ee08c89d0e4627e6761fbfa993eccf29e436b6ac32efbfc6f7d954c9b0  /tmp/frozen-replay.zip' | sha256sum -c -
          unzip -q /tmp/frozen-replay.zip -d /tmp/frozen-replay
      - name: Verify mechanism on fixed historical predictions
        env:
          PYTHONPATH: iris_report/iris_sep
        run: |
          mkdir -p /tmp/multiplicity-covariance-v1
          python -m tools.verify_multiplicity_covariance_identity_v1 \
            --predictions /tmp/frozen-replay/matched_episode_sensitivity_predictions.csv \
            --point-results /tmp/frozen-replay/matched_episode_point_results.csv \
            --output /tmp/multiplicity-covariance-v1/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/multiplicity-covariance-v1/result.json')
          d=json.loads(p.read_text())
          assert d['status']=='PASS', d
          assert d['protected_post_2025_outcomes_accessed'] is False
          assert d['max_internal_identity_absolute_error'] < 1e-10
          assert d['max_artifact_tss_absolute_error'] < 1e-6
          x={r['model']:r for r in d['models']}
          assert x['xgb_joint']['covariance_multiplicity_detection_fraction'] > 0
          assert x['past_proton_ge10_proxy']['covariance_multiplicity_detection_fraction'] > 0
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
      - name: Upload mechanism receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-multiplicity-covariance-v1-${{ github.sha }}
          path: /tmp/multiplicity-covariance-v1
          if-no-files-found: warn
          retention-days: 30
