name: IRIS v2 Residual-Bootstrap Extended Novelty Gate

on:
  push:
    branches: [iris-v2-physics-transfer]
    paths:
      - '.github/workflows/iris-v2-residual-bootstrap-extension.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extended-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-v2-physics-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Download immutable historical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence_bundle evidence
          gh run download 32937498427 -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          test -f evidence/data/derived/training_manifest.csv.gz
      - name: Generate and audit alpha 0.30, 0.40, 0.50 with shared cache
        shell: bash
        run: |
          set -euo pipefail
          for A in 0.30 0.40 0.50; do
            TAG=$(python -c "print(f'{float(\"$A\"):.2f}')")
            python iris-model/generate_residual_bootstrap.py \
              --evidence-dir evidence --cache-dir shared_cache --out-dir "candidate/${TAG}" \
              --alpha "$A" --sigma 4.0 --per-group 2 --max-groups 64 --seed 2026 --download-workers 16
            python iris-model/evaluate_generator_v2.py \
              --evidence-dir evidence --cache-dir shared_cache \
              --synthetic-manifest "candidate/${TAG}/synthetic_manifest.csv" \
              --out-dir "audit/${TAG}" --real-per-group 2 --seed 2026
            python iris-model/evaluate_synthetic_novelty.py \
              --evidence-dir evidence --cache-dir shared_cache \
              --synthetic-manifest "candidate/${TAG}/synthetic_manifest.csv" \
              --out "novelty_${TAG}.json" --real-per-group 2 --seed 2026
          done
      - name: Select smallest passing extended alpha
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          rows=[]
          for a in [0.30,0.40,0.50]:
              tag=f'{a:.2f}'
              p=json.loads(pathlib.Path(f'audit/{tag}/v2_manipulation_metrics.json').read_text())
              n=json.loads(pathlib.Path(f'novelty_{tag}.json').read_text())
              rows.append({
                  'alpha':a,
                  'generic_gate':bool(p['generic_fidelity_gate_pass']),
                  'generic_distance_ratio':p['generic_distance_to_real_baseline_ratio'],
                  'flux_ratio':p['synthetic_to_real_flux_median_ratio'],
                  'active_area_ratio':p['synthetic_to_real_active_area_median_ratio'],
                  'diversity_ratio':p['synthetic_to_real_diversity_ratio'],
                  'novelty_ratio':n['novelty_ratio_to_real_nn_median'],
                  'novelty_gate':bool(n['novelty_gate_pass']),
                  'hard_pil_distance':p['hard_pil_standardized_energy_distance'],
                  'hard_geometry_distance':p['hard_geometry_standardized_energy_distance'],
              })
          passing=[r for r in rows if r['generic_gate'] and r['novelty_gate']]
          chosen=min((r['alpha'] for r in passing),default=None)
          report={
              'phase':'TRAIN-ONLY residual-bootstrap BASE selection; no forecast validation/test accessed',
              'known_lower_alpha_result':'alpha 0.05/0.10/0.20 all passed generic fidelity but failed novelty in run 33077177556',
              'rows':rows,
              'chosen_smallest_passing_alpha':chosen,
              'status':'PASS' if chosen is not None else 'FAIL',
              'gate_rule':'generic_fidelity_gate_pass AND novelty_gate_pass; choose smallest alpha',
              'forecast_outcomes_accessed':False,
          }
          pathlib.Path('residual_bootstrap_extended_gate.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if chosen is None:
              raise SystemExit('No residual-bootstrap alpha <=0.50 passes both generic fidelity and novelty; generator redesign required')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-v2-residual-bootstrap-extended-gate
          path: |
            residual_bootstrap_extended_gate.json
            novelty_*.json
            audit
            candidate/*/sampling_summary.json
          retention-days: 30
