name: IRIS-SEP preregistered daily modality outage

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/config/daily_modality_outage_preregistration_2026-09-06.json'
      - 'iris_report/iris_sep/config/selective_outage_policy_preregistration_2026-09-06.json'
      - 'iris_report/iris_sep/config/source_provenance_contract_v1.json'
      - 'iris_report/iris_sep/tools/run_daily_modality_outage.py'
      - 'iris_report/iris_sep/tools/audit_daily_modality_outage.py'
      - 'iris_report/iris_sep/tools/run_selective_outage_policy.py'
      - 'iris_report/iris_sep/tools/run_promoted_stack_missingness_transfer.py'
      - 'iris_report/iris_sep/tools/run_public_new_crossing_benchmark.py'
      - 'iris_report/iris_sep/tools/run_context_stability_diagnostic.py'
      - 'iris_report/iris_sep/src/iris_sep/modeling/positive_evidence_stack.py'
      - 'iris_report/iris_sep/src/iris_sep/missingness_experiment.py'
      - 'iris_report/iris_sep/tests/test_daily_modality_outage.py'
      - 'iris_report/iris_sep/tests/test_selective_outage_policy.py'
      - '.github/workflows/iris-sep-daily-modality-outage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - name: Install pinned experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.3.2 \
            scipy==1.18.1 \
            scikit-learn==1.8.0 \
            xgboost==3.0.4

      - name: Verify preregistrations predate result-capable head
        run: |
          OUTAGE_PREREG_COMMIT='15059089f856215ac3c3474fe91014edaa2f46b1'
          POLICY_PREREG_COMMIT='9363fd07b4538784a6857572dbed341ee150f4d0'
          git cat-file -e "${OUTAGE_PREREG_COMMIT}^{commit}"
          git cat-file -e "${POLICY_PREREG_COMMIT}^{commit}"
          git merge-base --is-ancestor "$OUTAGE_PREREG_COMMIT" HEAD
          git merge-base --is-ancestor "$POLICY_PREREG_COMMIT" HEAD
          test -s iris_report/iris_sep/config/daily_modality_outage_preregistration_2026-09-06.json
          test -s iris_report/iris_sep/config/selective_outage_policy_preregistration_2026-09-06.json
          test -s iris_report/iris_sep/config/source_provenance_contract_v1.json
          sha256sum \
            iris_report/iris_sep/config/daily_modality_outage_preregistration_2026-09-06.json \
            iris_report/iris_sep/config/selective_outage_policy_preregistration_2026-09-06.json \
            iris_report/iris_sep/config/source_provenance_contract_v1.json

      - name: Compile and test outage and handling-policy contracts
        run: |
          python -m py_compile \
            iris_report/iris_sep/tools/run_daily_modality_outage.py \
            iris_report/iris_sep/tools/audit_daily_modality_outage.py \
            iris_report/iris_sep/tools/run_selective_outage_policy.py \
            iris_report/iris_sep/tools/run_promoted_stack_missingness_transfer.py \
            iris_report/iris_sep/tools/run_public_new_crossing_benchmark.py \
            iris_report/iris_sep/tools/run_context_stability_diagnostic.py \
            iris_report/iris_sep/src/iris_sep/modeling/positive_evidence_stack.py \
            iris_report/iris_sep/src/iris_sep/missingness_experiment.py
          python -m unittest \
            iris_report.iris_sep.tests.test_daily_modality_outage \
            iris_report.iris_sep.tests.test_selective_outage_policy \
            iris_report.iris_sep.tests.test_positive_evidence_stack \
            iris_report.iris_sep.tests.test_missingness_experiment \
            -v

      - name: Acquire exact hash-pinned public development inputs
        run: |
          mkdir -p /tmp/iris-input/Data
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/Data/rolling_combinded_seq_24hours.csv' \
            --output /tmp/iris-input/Data/rolling_combinded_seq_24hours.csv
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv' \
            --output /tmp/iris-input/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv
          test "$(sha256sum /tmp/iris-input/Data/rolling_combinded_seq_24hours.csv | cut -d' ' -f1)" = '4691cedd3209a2823b9e3c5e3dfe5676bde42befc1af14e33f35a220b6dfa0fb'
          test "$(sha256sum /tmp/iris-input/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv | cut -d' ' -f1)" = '0ec9f0d6e088821091fcd369481bbbc9a2281a92fc8a582df40aefa62cae59b0'

      - name: Execute every preregistered daily outage scenario
        run: |
          python -m iris_report.iris_sep.tools.run_daily_modality_outage \
            --features /tmp/iris-input/Data/rolling_combinded_seq_24hours.csv \
            --events /tmp/iris-input/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv \
            --output /tmp/iris-daily-modality-outage

      - name: Independently recompute all saved performance metrics
        run: |
          python -m iris_report.iris_sep.tools.audit_daily_modality_outage \
            --predictions /tmp/iris-daily-modality-outage/predictions.csv \
            --summary /tmp/iris-daily-modality-outage/summary.json \
            --output /tmp/iris-daily-modality-outage/independent_audit.json

      - name: Execute every preregistered handling-policy evaluation
        run: |
          python -m iris_report.iris_sep.tools.run_selective_outage_policy \
            --predictions /tmp/iris-daily-modality-outage/predictions.csv \
            --outage-summary /tmp/iris-daily-modality-outage/summary.json \
            --independent-audit /tmp/iris-daily-modality-outage/independent_audit.json \
            --output /tmp/iris-daily-modality-outage/selective_policy.json

      - name: Print bounded experiment summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/iris-daily-modality-outage/summary.json').read_text())
          a=json.loads(Path('/tmp/iris-daily-modality-outage/independent_audit.json').read_text())
          q=json.loads(Path('/tmp/iris-daily-modality-outage/selective_policy.json').read_text())
          print('audit_status', a['status'])
          print('scenario_count', a['scenario_count'])
          print('arm_count', a['arm_count'])
          print('policy_evaluations', a['policy_evaluations'])
          print('handling_policy_evaluations', q['policy_evaluations'])
          print('score_rows', s['score_rows'])
          print('score_positives', s['score_positives'])
          print('thresholds', json.dumps(s['model']['thresholds'], sort_keys=True))
          for key in sorted(s['scenarios']):
              row=s['scenarios'][key]
              print(key, 'rows=',row['affected_score_rows'], 'positives=',row['affected_score_positives'], 'events=',row['affected_positive_event_units'], 'hidden=',row['finite_interface_cells_hidden'], 'evaluable_blocks=',row['evaluable_blocks'])
          PY

      - name: Bind runtime and immutable source hashes
        if: always()
        run: |
          mkdir -p /tmp/iris-daily-modality-outage
          python - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          import numpy, pandas, scipy, sklearn, xgboost
          def sha(path):
              p=Path(path); h=hashlib.sha256()
              if not p.exists(): return None
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''): h.update(b)
              return h.hexdigest()
          receipt = {
              'scope': 'DEVELOPMENT_ONLY_PREREGISTERED_DAILY_AGGREGATE_INTERFACE_OUTAGE_AND_HANDLING_POLICY',
              'git_head': '${{ github.sha }}',
              'outage_preregistration_ancestor_commit': '15059089f856215ac3c3474fe91014edaa2f46b1',
              'handling_policy_preregistration_ancestor_commit': '9363fd07b4538784a6857572dbed341ee150f4d0',
              'python': platform.python_version(),
              'numpy': numpy.__version__,
              'pandas': pandas.__version__,
              'scipy': scipy.__version__,
              'scikit_learn': sklearn.__version__,
              'xgboost': xgboost.__version__,
              'feature_table_sha256': sha('/tmp/iris-input/Data/rolling_combinded_seq_24hours.csv'),
              'event_catalogue_sha256': sha('/tmp/iris-input/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv'),
              'summary_sha256': sha('/tmp/iris-daily-modality-outage/summary.json'),
              'predictions_sha256': sha('/tmp/iris-daily-modality-outage/predictions.csv'),
              'independent_audit_sha256': sha('/tmp/iris-daily-modality-outage/independent_audit.json'),
              'selective_policy_sha256': sha('/tmp/iris-daily-modality-outage/selective_policy.json'),
              'locked_test_accessed': False,
              'monitor_used': False,
              'development_only': True,
          }
          Path('/tmp/iris-daily-modality-outage/runtime.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY

      - name: Upload immutable daily outage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-daily-modality-outage-${{ github.sha }}
          path: /tmp/iris-daily-modality-outage
          if-no-files-found: error
          retention-days: 30
