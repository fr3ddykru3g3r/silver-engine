name: IRIS v2 Physics Self-Test

on:
  push:
    branches: [iris-v2-physics-transfer]
    paths:
      - 'iris-model/physics_v2.py'
      - 'iris-model/physics_v2_selftest.py'
      - '.github/workflows/iris-v2-physics-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-v2-physics-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile v2 code
        run: python -m compileall -q iris-model
      - name: Run differentiable physics self-test
        shell: bash
        run: |
          set -euo pipefail
          cd iris-model
          python physics_v2_selftest.py | tee ../physics_v2_selftest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-v2-physics-selftest
          path: physics_v2_selftest.json
          if-no-files-found: ignore
          retention-days: 30
