name: IRIS-SEP contiguous modality outage benchmark v2

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/config/contiguous_modality_outage_preregistration_v2_2026-09-06.json'
      - 'iris_report/iris_sep/tools/run_contiguous_modality_outage_v2.py'
      - 'iris_report/iris_sep/tests/test_contiguous_modality_outage_v2.py'
      - '.github/workflows/iris-sep-contiguous-modality-outage-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outage-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out preregistered head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preregistration predates this result run
        run: |
          git merge-base --is-ancestor ffefb94faa9be1bda21386fdae7a7e0206d1a548 HEAD
          git merge-base --is-ancestor 0a510266433687dc9937c8851375832d354b8ca9 HEAD
          test -s iris_report/iris_sep/config/contiguous_modality_outage_preregistration_v2_2026-09-06.json
          test -s iris_report/iris_sep/tools/run_contiguous_modality_outage_v2.py
          sha256sum \
            iris_report/iris_sep/config/contiguous_modality_outage_preregistration_v2_2026-09-06.json \
            iris_report/iris_sep/tools/run_contiguous_modality_outage_v2.py \
            iris_report/iris_sep/tests/test_contiguous_modality_outage_v2.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.3.2 scipy==1.18.1 scikit-learn==1.8.0 xgboost==3.0.4

      - name: Compile and test frozen source-clock path
        run: |
          python -m py_compile \
            iris_report/iris_sep/tools/run_contiguous_modality_outage_v2.py \
            iris_report/iris_sep/tools/run_promoted_stack_missingness_transfer.py \
            iris_report/iris_sep/tools/run_crossfit_evidence_stack_diagnostic.py \
            iris_report/iris_sep/src/iris_sep/modeling/positive_evidence_stack.py \
            iris_report/iris_sep/src/iris_sep/missingness_experiment.py \
            iris_report/iris_sep/src/iris_sep/missingness_recovery.py
          python -m unittest \
            iris_report.iris_sep.tests.test_contiguous_modality_outage_v2 \
            iris_report.iris_sep.tests.test_positive_evidence_stack \
            iris_report.iris_sep.tests.test_missingness_experiment \
            iris_report.iris_sep.tests.test_missingness_recovery -v

      - name: Acquire exact hash-pinned public development inputs
        run: |
          mkdir -p /tmp/iris-input/Data
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/Data/rolling_combinded_seq_24hours.csv' \
            --output /tmp/iris-input/Data/rolling_combinded_seq_24hours.csv
          curl --fail --location --retry 3 --retry-all-errors \
            'https://media.githubusercontent.com/media/yuyian/SEP-Prediction-V2/e138dcd72c1952a00e11e1a0b025337f9e7c93fb/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv' \
            --output /tmp/iris-input/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv
          test "$(sha256sum /tmp/iris-input/Data/rolling_combinded_seq_24hours.csv | cut -d' ' -f1)" = '4691cedd3209a2823b9e3c5e3dfe5676bde42befc1af14e33f35a220b6dfa0fb'
          test "$(sha256sum /tmp/iris-input/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv | cut -d' ' -f1)" = '0ec9f0d6e088821091fcd369481bbbc9a2281a92fc8a582df40aefa62cae59b0'

      - name: Run every preregistered source-clock outage scenario
        run: |
          python -m iris_report.iris_sep.tools.run_contiguous_modality_outage_v2 \
            --features /tmp/iris-input/Data/rolling_combinded_seq_24hours.csv \
            --events /tmp/iris-input/GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv \
            --output /tmp/iris-contiguous-modality-outage-v2

      - name: Bind runtime and source
        if: always()
        run: |
          mkdir -p /tmp/iris-contiguous-modality-outage-v2
          python - <<'PY'
          import hashlib, importlib.metadata, json, platform
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def version(distribution):
              try:
                  return importlib.metadata.version(distribution)
              except importlib.metadata.PackageNotFoundError:
                  return None

          receipt = {
              'git_head': '${{ github.sha }}',
              'python': platform.python_version(),
              'numpy': version('numpy'),
              'pandas': version('pandas'),
              'scipy': version('scipy'),
              'scikit_learn': version('scikit-learn'),
              'xgboost': version('xgboost'),
              'runner_sha256': digest('iris_report/iris_sep/tools/run_contiguous_modality_outage_v2.py'),
              'preregistration_sha256': digest('iris_report/iris_sep/config/contiguous_modality_outage_preregistration_v2_2026-09-06.json'),
              'test_sha256': digest('iris_report/iris_sep/tests/test_contiguous_modality_outage_v2.py'),
              'workflow_only_retry_after_shallow_checkout_failure': True,
              'v1_failed_run_preserved': True,
              'locked_test_accessed': False,
              'monitor_used': False,
              'development_only': True,
          }
          Path('/tmp/iris-contiguous-modality-outage-v2/runtime.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload immutable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-contiguous-modality-outage-v2-${{ github.sha }}
          path: /tmp/iris-contiguous-modality-outage-v2
          if-no-files-found: error
          retention-days: 30
