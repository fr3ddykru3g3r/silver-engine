name: IRIS v2 Positive-Only HJ Lambda Sweep

on:
  push:
    branches: [iris-v2-physics-transfer]
    paths:
      - '.github/workflows/iris-v2-positive-hj-lambda-sweep.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  arm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: base
            condition: base
            lambda_hj: '0.0'
          - tag: hj010
            condition: hj
            lambda_hj: '0.10'
          - tag: hj050
            condition: hj
            lambda_hj: '0.50'
          - tag: hj100
            condition: hj
            lambda_hj: '1.00'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-v2-physics-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          grep -v -E '^(torch|torchvision)' iris-model/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Download frozen historical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence_bundle evidence
          gh run download 32937498427 -n iris-historical-evidence-integrity -D evidence_bundle
          tar -xzf evidence_bundle/iris-historical-evidence-integrity.tar.gz -C evidence
          test -f evidence/data/derived/training_manifest.csv.gz
      - name: Train positive-only generator
        run: |
          python iris-model/train_generator_positive_v2.py \
            --evidence-dir evidence --cache-dir cache/${{ matrix.tag }} --out-dir outputs/${{ matrix.tag }} \
            --condition ${{ matrix.condition }} --lambda-hj ${{ matrix.lambda_hj }} --lambda-pil 0.0 --seed 2026 \
            --per-group 4 --batch-size 16 --physics-batch-size 16 --base-channels 16 \
            --diffusion-steps 100 --max-steps 1200 --physics-warmup-steps 200 --download-workers 16
      - name: Sample
        run: |
          python iris-model/sample_generator.py \
            --checkpoint outputs/${{ matrix.tag }}/generator.pt --evidence-dir evidence \
            --out-dir samples/${{ matrix.tag }} --per-group 2 --max-groups 64 --batch-size 8 --sampling-steps 50 --seed 2026
      - name: Independent hard manipulation evaluation
        run: |
          python iris-model/evaluate_generator_v2.py \
            --evidence-dir evidence --cache-dir cache_eval/${{ matrix.tag }} \
            --synthetic-manifest samples/${{ matrix.tag }}/synthetic_manifest.csv \
            --out-dir eval/${{ matrix.tag }} --real-per-group 2 --seed 2026
      - uses: actions/upload-artifact@v4
        with:
          name: iris-v2-positive-hj-${{ matrix.tag }}
          path: |
            outputs/${{ matrix.tag }}
            samples/${{ matrix.tag }}
            eval/${{ matrix.tag }}
          retention-days: 30

  summarize:
    needs: arm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iris-v2-positive-hj-*
          path: collected
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rank by train-only HJ fidelity gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,csv
          root=pathlib.Path('collected'); rows=[]
          for tag in ['base','hj010','hj050','hj100']:
            fs=list((root/f'iris-v2-positive-hj-{tag}').rglob('v2_manipulation_metrics.json'))
            if len(fs)!=1: raise RuntimeError((tag,fs))
            m=json.loads(fs[0].read_text())
            rows.append({'tag':tag,'geometry_distance':m['hard_geometry_standardized_energy_distance'],'pil_distance':m['hard_pil_standardized_energy_distance'],'flux_ratio_to_real':m['synthetic_to_real_flux_median_ratio'],'active_area_ratio_to_real':m['synthetic_to_real_active_area_median_ratio'],'diversity_ratio_to_real':m['synthetic_to_real_diversity_ratio'],'generic_distance_ratio':m['generic_distance_to_real_baseline_ratio'],'saturation':m['synthetic_saturation_fraction_abs_gt_2900G'],'generic_gate':bool(m['generic_fidelity_gate_pass'])})
          base=rows[0]
          for r in rows:
            r['geometry_improvement_vs_base']=(base['geometry_distance']-r['geometry_distance'])/base['geometry_distance'] if base['geometry_distance']>0 else -999
            r['physics_gate']=bool(r['tag']!='base' and r['generic_gate'] and r['geometry_improvement_vs_base']>=0.20)
          eligible=[r for r in rows[1:] if r['physics_gate']]
          chosen=min(eligible,key=lambda z: float(z['tag'].replace('hj','')))['tag'] if eligible else None
          report={'phase':'TRAIN-ONLY HJ generator selection; no forecast validation/test accessed','rows':rows,'chosen_smallest_passing_lambda_tag':chosen,'status':'PASS' if chosen else 'FAIL'}
          pathlib.Path('positive_hj_lambda_sweep_summary.json').write_text(json.dumps(report,indent=2)+'\n')
          with open('positive_hj_lambda_sweep.csv','w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iris-v2-positive-hj-lambda-summary
          path: |
            positive_hj_lambda_sweep_summary.json
            positive_hj_lambda_sweep.csv
          retention-days: 30
