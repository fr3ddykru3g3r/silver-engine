name: IRIS-SEP fresh source audit

on:
  push:
    branches:
      - codex/iris-sep-continuation-20260905
    paths:
      - 'iris_report/iris_sep/tools/run_fresh_source_audit.py'
      - 'iris_report/iris_sep/tests/test_fresh_source_audit.py'
      - '.github/workflows/iris-sep-fresh-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install bounded audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.3.2 requests==2.32.5 drms==0.9.1 pytest==8.4.2

      - name: Compile and run offline parser tests
        run: |
          python -m py_compile iris_report/iris_sep/tools/run_fresh_source_audit.py
          python -m pytest -q iris_report/iris_sep/tests/test_fresh_source_audit.py

      - name: Run fresh source audit
        run: |
          rm -rf /tmp/iris-sep-fresh-source-audit
          python -m iris_report.iris_sep.tools.run_fresh_source_audit \
            --output /tmp/iris-sep-fresh-source-audit

      - name: Bind runtime and head
        run: |
          python - <<'PY'
          import json, platform
          from pathlib import Path
          import drms, numpy, pandas, requests
          p=Path('/tmp/iris-sep-fresh-source-audit/runtime.json')
          p.write_text(json.dumps({
            'git_head': '${{ github.sha }}',
            'python': platform.python_version(),
            'numpy': numpy.__version__,
            'pandas': pandas.__version__,
            'requests': requests.__version__,
            'drms': drms.__version__,
            'forecast_skill_recomputed': False,
            'locked_test_accessed': False,
            'monitor_used': False,
          }, indent=2, sort_keys=True)+'\n')
          PY

      - name: Upload immutable fresh-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-fresh-source-audit-${{ github.sha }}
          path: /tmp/iris-sep-fresh-source-audit
          if-no-files-found: warn
          retention-days: 30
