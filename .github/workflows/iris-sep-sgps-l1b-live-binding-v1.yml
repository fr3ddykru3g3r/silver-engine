name: IRIS-SEP SGPS L1b live binding V1

on:
  push:
    branches:
      - codex/iris-sep-fpr-controller-v2-20260912
    paths:
      - 'iris_report/iris_sep/config/sgps_l1b_live_binding_v1_2026-09-12.json'
      - 'iris_report/iris_sep/tools/run_sgps_l1b_live_binding_v1.py'
      - 'iris_report/iris_sep/tests/test_sgps_l1b_live_binding_v1.py'
      - '.github/workflows/iris-sep-sgps-l1b-live-binding-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.5 netCDF4==1.7.2 pytest==8.4.2

      - name: Run offline binding tests
        run: |
          python -m py_compile iris_report/iris_sep/tools/run_sgps_l1b_live_binding_v1.py
          python -m pytest -q iris_report/iris_sep/tests/test_sgps_l1b_live_binding_v1.py

      - name: Run frozen source-only binding probe
        run: |
          rm -rf /tmp/sgps-l1b-live-binding-v1
          python -m iris_report.iris_sep.tools.run_sgps_l1b_live_binding_v1 \
            --output /tmp/sgps-l1b-live-binding-v1

      - name: Bind runtime safety receipt
        if: always()
        run: |
          mkdir -p /tmp/sgps-l1b-live-binding-v1
          python - <<'PY'
          import json, platform
          from pathlib import Path
          import netCDF4, requests
          p=Path('/tmp/sgps-l1b-live-binding-v1/runtime.json')
          p.write_text(json.dumps({
            'git_head': '${{ github.sha }}',
            'python': platform.python_version(),
            'requests': requests.__version__,
            'netCDF4': netCDF4.__version__,
            'training_performed': False,
            'labels_derived': False,
            'forecast_skill_computed': False,
            'protected_outcomes_accessed': False,
          }, indent=2, sort_keys=True)+'\n')
          PY

      - name: Upload source-binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-sgps-l1b-live-binding-v1-${{ github.sha }}
          path: /tmp/sgps-l1b-live-binding-v1
          if-no-files-found: warn
          retention-days: 30
