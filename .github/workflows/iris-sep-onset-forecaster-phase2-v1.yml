name: IRIS-SEP Phase II direct-onset forecaster

on:
  push:
    branches:
      - codex/iris-sep-onset-forecaster-phase2-20260911
    paths:
      - 'iris_report/iris_sep/config/onset_forecaster_phase2_v1_preregistration_2026-09-11.json'
      - 'iris_report/iris_sep/architecture/PHASE2_PRE_EXECUTION_CORRECTION_2026-09-11.md'
      - 'iris_report/iris_sep/tools/run_onset_forecaster_phase2_v1.py'
      - 'iris_report/iris_sep/tools/run_onset_forecaster_phase2_v1_execution.py'
      - 'iris_report/iris_sep/tests/test_onset_forecaster_phase2_v1.py'
      - '.github/workflows/iris-sep-onset-forecaster-phase2-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-onset-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Phase II branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.3.2 \
            requests==2.32.5 \
            scipy==1.16.2 \
            scikit-learn==1.8.0 \
            xgboost==3.0.4 \
            netCDF4==1.7.2 \
            matplotlib==3.10.6 \
            joblib==1.5.2 \
            pytest==8.4.2

      - name: Compile Phase II and frozen dependency sources
        run: |
          python -m py_compile iris_report/iris_sep/tools/run_onset_forecaster_phase2_v1.py
          python -m py_compile iris_report/iris_sep/tools/run_onset_forecaster_phase2_v1_execution.py
          python -m py_compile iris_report/iris_sep/tools/run_episode_normalized_development_benchmark_v1.py
          python -m py_compile iris_report/iris_sep/tools/run_freshness_crossover_study_v1.py

      - name: Run Phase II source tests
        env:
          PYTHONPATH: iris_report/iris_sep
        run: |
          python -m pytest -q iris_report/iris_sep/tests/test_onset_forecaster_phase2_v1.py

      - name: Validate protected boundary before any real-data acquisition
        env:
          PYTHONPATH: iris_report/iris_sep
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('iris_report/iris_sep/config/onset_forecaster_phase2_v1_preregistration_2026-09-11.json')
          cfg = json.loads(p.read_text())
          assert cfg['status'] == 'FROZEN_BEFORE_PHASE2_SCORE_INSPECTION'
          assert cfg['separation']['frozen_benchmark_branch_untouched'] is True
          assert cfg['separation']['protected_post_2025_outcomes_may_be_accessed'] is False
          assert cfg['separation']['phase2_results_are_development_evidence_only'] is True
          assert cfg['data']['years'] == '2011-2017'
          print('Phase II boundary validated: historical development only; protected post-2025 outcomes remain sealed.')
          PY

      - name: Run preregistered Phase II historical development experiment
        env:
          PYTHONPATH: iris_report/iris_sep
          MPLBACKEND: Agg
        run: |
          rm -rf /tmp/iris-sep-phase2-onset
          python -m tools.run_onset_forecaster_phase2_v1_execution --output /tmp/iris-sep-phase2-onset

      - name: Verify result and claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/iris-sep-phase2-onset')
          summary = json.loads((root / 'phase2_summary.json').read_text())
          assert summary['study_id'] == 'IRIS_SEP_ONSET_FORECASTER_PHASE2_V1'
          assert summary['status'] == 'DEVELOPMENT_COMPLETE'
          assert summary['protected_post_2025_outcomes_accessed'] is False
          assert 'state of the art' in summary['claim_boundary']
          assert (root / 'phase2_score_metrics.csv').exists()
          assert (root / 'phase2_score_predictions.csv').exists()
          print((root / 'phase2_score_metrics.csv').read_text())
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Recompute artifact hashes after result generation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/iris-sep-phase2-onset')
          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1 << 20), b''):
                      h.update(block)
              return h.hexdigest()
          manifest = {
              str(p.relative_to(root)): sha(p)
              for p in sorted(root.rglob('*'))
              if p.is_file() and p.name != 'evidence_hashes.json'
          }
          (root / 'evidence_hashes.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(f'Hashed {len(manifest)} Phase II evidence files.')
          PY

      - name: Upload immutable Phase II development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-phase2-onset-${{ github.sha }}
          path: /tmp/iris-sep-phase2-onset
          if-no-files-found: warn
          retention-days: 30
