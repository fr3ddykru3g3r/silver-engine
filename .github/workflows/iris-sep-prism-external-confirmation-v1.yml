name: IRIS-SEP SEP-PRISM external confirmation V1

on:
  push:
    branches:
      - codex/iris-sep-episode-benchmark-v1-20260909
    paths:
      - 'iris_report/iris_sep/config/sep_prism_external_confirmation_v1_preregistration_2026-09-10.json'
      - 'iris_report/iris_sep/config/sep_prism_external_confirmation_v1_era_sensitivity_2026-09-10.json'
      - 'iris_report/iris_sep/config/sep_prism_external_confirmation_v1_estimand_clarification_2026-09-10.json'
      - 'iris_report/iris_sep/tools/run_sep_prism_external_confirmation_v1.py'
      - 'iris_report/iris_sep/tools/verify_sep_prism_external_confirmation_v1.py'
      - '.github/workflows/iris-sep-prism-external-confirmation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out IRIS benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install pinned analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.3.2
          git lfs version

      - name: Compile confirmation and verifier
        run: |
          python -m py_compile iris_report/iris_sep/tools/run_sep_prism_external_confirmation_v1.py
          python -m py_compile iris_report/iris_sep/tools/verify_sep_prism_external_confirmation_v1.py

      - name: Validate preregistration before external outcome access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('iris_report/iris_sep/config')
          pre=json.loads((root/'sep_prism_external_confirmation_v1_preregistration_2026-09-10.json').read_text())
          era=json.loads((root/'sep_prism_external_confirmation_v1_era_sensitivity_2026-09-10.json').read_text())
          est=json.loads((root/'sep_prism_external_confirmation_v1_estimand_clarification_2026-09-10.json').read_text())
          assert pre['status']=='FROZEN_BEFORE_EXTERNAL_OUTCOME_BREAKDOWN_INSPECTION'
          assert pre['upstream']['commit']=='e138dcd72c1952a00e11e1a0b025337f9e7c93fb'
          assert pre['claim_boundary']['protected_post_2025_local_outcomes_accessed'] is False
          assert era['status']=='FROZEN_BEFORE_LFS_OUTCOME_ACCESS'
          assert est['status']=='FROZEN_BEFORE_LFS_OUTCOME_ACCESS'
          assert est['primary_gate_unchanged'].startswith('strong confirmation requires')
          print('Pre-outcome contracts validated.')
          PY

      - name: Acquire exact pinned SEP-PRISM LFS sources
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          rm -rf /tmp/sep-prism-upstream
          git clone --filter=blob:none --no-checkout https://github.com/yuyian/SEP-Prediction-V2.git /tmp/sep-prism-upstream
          cd /tmp/sep-prism-upstream
          git checkout e138dcd72c1952a00e11e1a0b025337f9e7c93fb
          test "$(git rev-parse HEAD)" = "e138dcd72c1952a00e11e1a0b025337f9e7c93fb"
          git lfs install --local
          git lfs pull --include='Data/rolling_combinded_seq_24hours.csv,GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv'
          sha256sum Data/rolling_combinded_seq_24hours.csv GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv
          test "$(sha256sum Data/rolling_combinded_seq_24hours.csv | awk '{print $1}')" = "4691cedd3209a2823b9e3c5e3dfe5676bde42befc1af14e33f35a220b6dfa0fb"
          test "$(sha256sum GOES_integral_PRIMARY.1986-02-03.2025-09-10_sep_events.csv | awk '{print $1}')" = "0ec9f0d6e088821091fcd369481bbbc9a2281a92fc8a582df40aefa62cae59b0"

      - name: Run preregistered model-free external confirmation
        run: |
          rm -rf /tmp/sep-prism-confirmation
          python iris_report/iris_sep/tools/run_sep_prism_external_confirmation_v1.py \
            --upstream-root /tmp/sep-prism-upstream \
            --output /tmp/sep-prism-confirmation

      - name: Independently verify from persisted upstream copies
        run: |
          python iris_report/iris_sep/tools/verify_sep_prism_external_confirmation_v1.py \
            /tmp/sep-prism-confirmation \
            --output /tmp/sep-prism-confirmation/independent_verification_v1.json

      - name: Record runtime and final evidence hashes
        run: |
          python - <<'PY'
          import hashlib,json,platform
          from pathlib import Path
          import numpy,pandas
          root=Path('/tmp/sep-prism-confirmation')
          runtime={
            'git_head':'${{ github.sha }}',
            'workflow_run':'${{ github.run_id }}',
            'python':platform.python_version(),
            'numpy':numpy.__version__,
            'pandas':pandas.__version__,
            'upstream_commit':'e138dcd72c1952a00e11e1a0b025337f9e7c93fb',
            'protected_local_post_2025_outcomes_accessed':False,
            'model_scores_computed':False,
            'external_public_confirmation':True,
          }
          (root/'runtime.json').write_text(json.dumps(runtime,indent=2,sort_keys=True)+'\n')
          # Final manifest excludes itself and covers every other regular evidence file.
          def sha(p):
            h=hashlib.sha256();
            with p.open('rb') as f:
              for b in iter(lambda:f.read(1<<20),b''): h.update(b)
            return h.hexdigest()
          files=sorted(p for p in root.iterdir() if p.is_file() and p.name!='final_evidence_manifest.json')
          manifest={p.name:sha(p) for p in files}
          (root/'final_evidence_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify final evidence manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/sep-prism-confirmation')
          manifest=json.loads((root/'final_evidence_manifest.json').read_text())
          bad=[]
          for name,expected in manifest.items():
            h=hashlib.sha256()
            with (root/name).open('rb') as f:
              for b in iter(lambda:f.read(1<<20),b''): h.update(b)
            if h.hexdigest()!=expected: bad.append(name)
          assert not bad,bad
          receipt=json.loads((root/'independent_verification_v1.json').read_text())
          assert receipt['passed'] is True, receipt
          print(f'Final manifest verified: {len(manifest)} files; independent verifier PASS.')
          PY

      - name: Upload immutable SEP-PRISM confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: iris-sep-prism-external-confirmation-v1-${{ github.sha }}
          path: /tmp/sep-prism-confirmation
          if-no-files-found: error
          retention-days: 30
